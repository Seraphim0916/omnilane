name: ci
on:
  push:
    branches: [main, "dot/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Temporary negative control on the dedicated branch; not a proposed change.
jobs:
  macos-behavior:
    runs-on: ubuntu-24.04
    needs: [macos-python, macos-shell]
    if: always()
    steps:
      - name: require both macOS suites to pass
        env:
          PYTHON_RESULT: ${{ needs.macos-python.result }}
          SHELL_RESULT: ${{ needs.macos-shell.result }}
        run: |
          printf 'macos-python=%s macos-shell=%s\n' "$PYTHON_RESULT" "$SHELL_RESULT"
          test "$PYTHON_RESULT" = success && test "$SHELL_RESULT" = success

  macos-python:
    if: ${{ false }}
    runs-on: macos-latest
    steps:
      - run: exit 0

  macos-shell:
    runs-on: macos-latest
    steps:
      - name: emit deterministic synthetic failure
        run: |
          printf '%s\n' 'SYNTHETIC NEGATIVE CONTROL'
          exit 1
