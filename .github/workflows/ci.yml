name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: bash syntax
        run: |
          for f in bin/omnilane scripts/*.sh scripts/lib/*.sh scripts/runners/*.sh install.sh; do
            bash -n "$f"
          done
      - name: perl syntax
        run: perl -c scripts/lib/job-timeout.pl
      # ShellCheck 0.11.0: latest stable, warning-clean on this supported baseline.
      - name: install pinned ShellCheck
        run: |
          archive="$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$archive"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -S warning bin/omnilane scripts/*.sh scripts/lib/*.sh scripts/runners/*.sh install.sh
      - name: Python syntax
        run: python -m py_compile scripts/ui.py scripts/benchmark.py tests/test_ui.py tests/test_benchmark.py tests/test_ci_policy.py
      - name: no stale project name
        run: |
          ! grep -ri 'omniroute' --exclude-dir=.git --exclude-dir=.github .

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: routing table smoke
        run: |
          out="$(bash scripts/dispatch.sh --list)"
          echo "$out"
          test "$(printf '%s\n' "$out" | wc -l)" -ge 8
      - name: Strict doctor acceptance
        shell: bash
        run: |
          set -euo pipefail
          acceptance="$RUNNER_TEMP/omnilane-doctor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$acceptance/home/jobs" "$acceptance/bin" "$acceptance/claude"
          chmod 700 "$acceptance/home/jobs"
          for cli in codex claude grok gemini agy; do
            printf '#!/usr/bin/env bash\nexit 0\n' > "$acceptance/bin/$cli"
            chmod +x "$acceptance/bin/$cli"
          done
          python -c 'import json,pathlib,sys; pathlib.Path(sys.argv[1]).write_text(json.dumps({"enabledPlugins":{"omnilane@omnilane":True},"extraKnownMarketplaces":{"omnilane":{"source":{"source":"directory","path":sys.argv[2]}}}}))' \
            "$acceptance/claude/settings.json" "$(pwd -P)"
          # A host with no transport overlay passes --strict only where a human is the operator.
          if ! CLAUDE_CONFIG_DIR="$acceptance/claude" OMNILANE_AA_OPERATOR_ASSERTED_HUMAN=1 \
            OMNILANE_HOME="$acceptance/home" PATH="$acceptance/bin:$PATH" \
            bin/omnilane doctor --strict --json > "$acceptance/doctor.json"; then
            cat "$acceptance/doctor.json"
            exit 1
          fi
          python -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and r["strict"]' \
            < "$acceptance/doctor.json"

  python-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the support floor; 3.14 is the current stable series.
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  shell-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: shell unit tests
        run: |
          OMNILANE_DEPTH=1 OMNILANE_TIMEOUT=1800 OMNILANE_TIMEOUT_PROBE=99 \
            bash tests/run.sh

  browser-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt
      - name: install Playwright and Chromium
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: real-browser behavior tests
        env:
          OMNILANE_TEST_USE_PLAYWRIGHT_BROWSER: "1"
        run: |
          python -c "from tests.ui_browser_harness import browser_available; assert browser_available"
          python -m unittest tests.test_ui.FrontendBrowserBehaviorTests
