# relative order (moving bulk-mechanical's head to GPT-6.1 Sol xhigh); coding-overflow drops unscored Kimi/Qwen/OpenCode
# rows; fast-agentic keeps its order while v5.0.1 publishes no time-to-first-token; triage, consult, live-search and
# arbitrate keep their purpose order. Derived rows (Orchestrator proxy 54 and 22 lower-effort upper bounds) stay out
# of value ranking and all lane chains.
# 2026-11-17 snapshot aa-v5.0.1-2026-11-17-v1 (approved 2026-11-17): AA v5.0.1 scores Gemini 4 Argon Medium (48, raw
# 47.60), replacing its conservative 50 bound and tightening Argon Low's upper bound to 48 (76 measured + 1 proxy +
# 21 upper bounds = 98 scored). `aa_rebaseline.py value` places `gemini-4-argon-medium` at #2 in ui-draft (right behind
# Carbon medium, keeping existing non-Ultra rungs directly behind it). In hardest-coding `value` picks Argon Medium at
