# omnilane — single routing table shared by every harness (CC / Codex / Grok / Antigravity)
# Format: one lane per line ->  lane: vendor model effort [| vendor model effort | off]
#   vendor  = codex | claude | grok | gemini | kimi | qwen | opencode | openrouter
#   openrouter is direct-API (needs only OPENROUTER_API_KEY + curl) and advise/consult
#   only — it cannot edit files, so it is not in the default work-capable chains.
#   effort  = codex reasoning effort / claude --effort / agy thinking suffix / grok --reasoning-effort
#   Fallback chain: the first candidate whose vendor CLI is installed wins, so the
#   same table degrades gracefully when you only subscribe to one or two vendors.
# Override any line in ~/.omnilane/routing.local.yaml (same format; local wins).
# Every benchmark score, price and throughput figure behind these orderings lives in
# docs/model-capabilities-2026-09.md, with the date it was retrieved. The comments below
# deliberately carry no numbers: they state WHY a lane is ordered the way it is, which
# stays true for months, while the numbers move every few weeks. Change an ordering and
# you update the doc; a figure going stale should never need a routing-table edit.
# (Audited 2026-07-12; re-audited 2026-07-25, 2026-08-02, 2026-08-03, 2026-09-02 and
# 2026-09-05; rewritten 2026-09-22 on Artificial Analysis Intelligence Index v4.3.2;
# Claude Opus 5.5 placed on the same rule 2026-09-23; rewritten value-first the same day
# with GPT-6 Sol and Luna; Claude Sonnet 5.5 and GPT-6.1 Sol placed on it 2026-09-30;
# 2026-10-08 proposal: multi-page capture adds Haiku 5.5; host transport proof is still required.
# re-scored 2026-10-02, when Sonnet 5.5 low was withdrawn and fast-agentic's two Sol low rows changed places.)
# How a chain is ordered — value first: each lane names the measurement that matches its
# kind of work. For every caller ceiling, take the best row on that measurement the ceiling
# can reach; among rows close to it, the cheapest wins. The chain lists those picks from the
# highest ceiling down, so whatever the caller's ceiling, the first candidate it can reach is
# the best-value one it can reach. "Close" is a near-tie in the quality-critical lanes
# (hardest-coding, hard-judgment, taste-final, long-context, coding-overflow) and a wider
# band in the throughput lanes, where a row also counts as close when it costs half as much
# for a gap twice that size. A cheaper row may not give up much on the lane's second
# measurement either. The tool that computes the picks is documented in
# docs/model-capabilities-2026-09.md. A candidate above the caller's ceiling, or one this
# host has not proven, is skipped. After the value picks, each chain ends with the other
# vendors' best rows, so a host with one subscription still gets a full chain. Cost is AA's
# cost to run its whole index at API prices — on subscription CLIs treat it as relative.
# max effort is in no chain: wherever it is ahead of the same model's xhigh row at all, it
# costs far more for it. Every max row stays selectable with --effort max.
# Your own job outcomes (~/.omnilane/jobs/) outrank these priors; edit lanes to match.

hardest-coding: codex gpt-6-astra xhigh | codex gpt-6.1-sol xhigh | claude claude-opus-5-5 medium | codex gpt-6.1-sol high | codex gpt-6-astra medium | codex gpt-6.1-sol medium | claude claude-fable-5-1 medium | claude claude-opus-5 high | claude claude-sonnet-5-5 high | codex gpt-6-astra low | claude claude-opus-5 medium | claude claude-opus-5-5 low | claude claude-haiku-5-5 xhigh | claude claude-sonnet-5-5 medium | claude claude-opus-5 low | grok grok-4.7 high | grok grok-4.6 high | gemini gemini-3.8-flash-high -  # 2026-10-08: Haiku 5.5 xhigh takes the score-41 value rung; Sonnet 5.5 medium stays directly behind for hosts without verified Haiku selectors. Higher rungs and cross-vendor fallbacks stay in place.
bulk-mechanical: codex gpt-6.1-sol medium | claude claude-opus-5-5 medium | codex gpt-6-astra medium | codex gpt-6.1-sol high | claude claude-sonnet-5-5 high | codex gpt-6.1-sol low | codex gpt-6-astra low | codex gpt-6-sol high | codex gpt-5.6-sol high | claude claude-opus-5-5 low | claude claude-haiku-5-5 xhigh | claude claude-sonnet-5-5 medium | claude claude-haiku-5-5 high | claude claude-haiku-5-5 medium | claude claude-haiku-5-5 low | codex gpt-6-sol medium | claude claude-opus-5 low | codex gpt-6-sol low | gemini gemini-3.8-flash-high -  # 2026-10-08: Haiku 5.5 xhigh/high/medium/low are the lower-ceiling value picks; old rows stay for hosts without proven selectors. Static chains cannot represent all non-monotone ceiling picks: see the generated value audit in docs/reports/aa-haiku-5-5-evidence-2026-10-08.md.
triage: codex gpt-6-luna high | codex gpt-5.6-luna high | gemini gemini-3.8-flash-low - | claude claude-haiku-5-5 medium | claude claude-haiku-5-5 low | claude claude-sonnet-5 low | claude claude-haiku-4-5 -  # Bought by run: Luna high stays the cheaper baseline near index 33. Haiku 5.5 medium then low dominate the old Claude rows on index, cost and time. Sonnet 5 low and Haiku 4.5 remain only as lower-ceiling / unproven-host fallbacks, not value winners.
hard-judgment: claude claude-opus-5-5 xhigh | claude claude-fable-5-1 xhigh | claude claude-opus-5-5 medium | claude claude-fable-5-1 medium | claude claude-opus-5 high | claude claude-opus-5 medium | claude claude-opus-5-5 low | codex gpt-6.1-sol xhigh | codex gpt-6-astra high | grok grok-4.7 high | gemini gemini-3.8-flash-high - # value-first on expert-level reasoning with graded analytical quality second and near-ties only: Opus 5.5 xhigh is the best row below max for less than half of Fable xhigh's money and leads analytical quality; Fable xhigh is ahead of Opus 5.5 high by more than a near-tie, so callers between the two get Fable xhigh; below them Opus 5.5 medium, then Fable medium and the Opus 5 ladder, with Opus 5.5 low as the cheap floor; GPT-6.1 Sol xhigh is Codex's best-value row, within a near-tie of Astra high for a fraction of the money, and the independent opinion for hosts without Claude (ask for it with --vendor codex), with Astra high right behind it until a host proves GPT-6.1 Sol; Grok 4.7 the third family; this lane is not a controller selector
taste-final: claude claude-sonnet-5-5 xhigh | claude claude-opus-5-5 xhigh | claude claude-opus-5-5 high | claude claude-sonnet-5-5 high | claude claude-opus-5-5 medium | grok grok-4.7 high | grok grok-4.6 high | codex gpt-6-astra xhigh | claude claude-haiku-5-5 xhigh | claude claude-haiku-5-5 high | gemini gemini-3.8-flash-high -  # 2026-10-08: Sonnet 5.5 xhigh is within the 30-Elo overall / 100-Elo presentation bands of Opus 5.5 xhigh at lower cost, so leads with Opus behind until proven. Haiku 5.5 xhigh/high cover lower ceilings before Flash.
consult: codex gpt-6-astra xhigh | claude claude-opus-5-5 xhigh | grok grok-4.7 high | grok grok-4.6 high | gemini gemini-3.8-flash-high - # direct named-model consultation is not a value lane: each vendor's strongest generally reachable configuration below max, with the older Grok behind the newer for a lane dispatch on a host that has not proven 4.7; keep --vendor to pin the requested family. --vendor takes the vendor's first segment and never falls through, so on a host that has not proven grok-4.7 ask for --model grok-4.6
ui-draft: claude claude-opus-5-5 high | codex gpt-6.1-sol high | claude claude-opus-5-5 medium | codex gpt-6-astra medium | codex gpt-6.1-sol medium | codex gpt-6.1-sol low | claude claude-opus-5-5 low | codex gpt-6-astra low | codex gpt-6-sol medium | gemini gemini-3.8-flash-high - # UI drafts need a design system or reference images; visual understanding is near-saturated at the top, so value decides within it, with hard coding second: Opus 5.5 high reads images within a near-tie of every row above it and codes close enough, for about half of xhigh's money; below it GPT-6.1 Sol high, medium and low are the value picks at their ceilings, reading images close to the best row each can reach for a fraction of the money, with Opus 5.5 medium, Astra medium, Opus 5.5 low and Astra low right behind them until a host proves GPT-6.1 Sol; GPT-6 Sol medium still reads images well but codes much worse; Fable and Sonnet 5.5 have no published visual result and are left out rather than assumed; none of this proves visual taste
long-context: claude claude-opus-5 high | claude claude-opus-5 medium | claude claude-opus-5 low | codex gpt-5.6-terra xhigh | gemini gemini-3.8-flash-high - # the established long-context benchmark is saturated and separates nobody; on the harder one Claude leads every other family by a wide margin at every effort, and Opus keeps that lead down to low effort, which makes it both the best and the cheap choice; Fable leads it only at max effort for several times the money; Opus 5.5 has no published result on it yet and is left out rather than assumed; Terra xhigh and Flash are the other vendors' best-value rows (Terra max scores higher for about twice the money and, like every max row, is explicit-only); context capacity alone proves nothing
fast-agentic: codex gpt-6.1-sol medium | codex gpt-6-astra medium | codex gpt-6.1-sol low | codex gpt-6-sol low | codex gpt-6-astra low | gemini gemini-3.8-flash-medium - | claude claude-sonnet-5-5 medium | claude claude-opus-5-5 low # tool loops need automation accuracy and a short time per step, value-first with the wide band, and a row that is slow to its first token is no fast row whatever it scores: GPT-6.1 Sol medium is within the band of the best quick starters for a fraction of the money (its high row scores a little higher but waits many times longer for the first token), with Astra medium right behind it until a host proves GPT-6.1 Sol; GPT-6 Sol high now waits too long for its first token and GPT-6 Sol medium has no published speed, so both are out; GPT-6.1 Sol low is the quick rung for every caller that can reach it, and GPT-6 Sol low, the fastest and cheapest row, sits behind it for the callers below that and for hosts without GPT-6.1 Sol; Astra low stays until a host proves GPT-6 Sol; Flash medium is the cross-vendor row; Sonnet 5.5 medium is the quick Claude row, level with Opus 5.5 low on automation, far quicker to its first token and cheaper, with Opus 5.5 low behind it until a host proves Sonnet 5.5; Haiku is gone because it scores close to nothing on automation
live-search: grok grok-4.7 high | grok grok-4.6 high | gemini gemini-3.8-flash-high - | claude claude-opus-5-5 low | off # Grok is the only native X/web source, newest proven release first, and both releases hallucinate less than any fallback that publishes a rate; Flash and Opus 5.5 low provide generic web search, not equivalent social context; Opus 5.5 low replaces medium because it is within a near-tie of medium on the knowledge benchmark for about half the money; Opus rather than Sonnet because Sonnet's effort rows assert more false facts than true ones on the knowledge benchmark
coding-overflow: grok grok-4.7 high | grok grok-4.6 high | gemini gemini-3.8-flash-high - | kimi kimi-k3 - | qwen qwen3-coder-plus - | opencode - - | off # explicit Codex-quota relief, so no Codex row: Grok 4.7 edges 4.6 on the hard terminal-coding benchmark and on scientific coding; keep all existing non-Codex fallbacks and do not infer unverified Qwen aliases from another harness
arbitrate: off - - # opinion panel remains opt-in because each voter and round consumes quota
                                                # Enable: `arbitrate: vote codex,claude,grok -` (any 1-4 of codex/claude/grok/gemini)
                                                # Debate round (each voter rebuts the others): set the effort field to 2.
                                                # Custom gate: `arbitrate: exec /path/to/script -`
# No automatic risk escalation or failure-triggered effort upgrade is added.
