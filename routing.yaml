# High in hardest-coding's Gemini tail (serving ceiling 48-49 `--vendor gemini` calls ahead of 3.8 Flash medium).
# Every lane head and the other ten lanes are unchanged.
# 2026-11-18 snapshot aa-v5.0.1-2026-11-18-v1: adds OpenAI GPT-6.2 Astra (`gpt-6.2-astra`: max 62, xhigh 62, high 60,
