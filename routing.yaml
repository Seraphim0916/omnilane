# omnilane — single routing table shared by every harness (CC / Codex / Grok / Antigravity)
# Format: one lane per line ->  lane: vendor model effort [| vendor model effort | off]
#   vendor  = codex | claude | grok | gemini | kimi | qwen | opencode | openrouter
#   openrouter is direct-API (needs only OPENROUTER_API_KEY + curl) and advise/consult
#   only — it cannot edit files, so it is not in the default work-capable chains.
#   effort  = codex reasoning effort / claude --effort / agy thinking suffix / grok --reasoning-effort
#   Fallback chain: the first candidate whose vendor CLI is installed wins, so the
#   same table degrades gracefully when you only subscribe to one or two vendors.
# Override any line in ~/.omnilane/routing.local.yaml (same format; local wins).
# Every benchmark score, price and throughput figure behind these orderings lives in
# docs/model-capabilities-2026-09.md, with the date it was retrieved. The comments below
# deliberately carry no numbers: they state WHY a lane is ordered the way it is, which
# stays true for months, while the numbers move every few weeks. Change an ordering and
# you update the doc; a figure going stale should never need a routing-table edit.
# (Audited 2026-07-12; re-audited 2026-07-25, 2026-08-02, 2026-08-03, 2026-09-02 and
# 2026-09-05; rewritten 2026-09-22 on Artificial Analysis Intelligence Index v4.3.2;
# Claude Opus 5.5 placed on the same rule 2026-09-23; rewritten value-first the same day
# with GPT-6 Sol and Luna.)
# How a chain is ordered — value first: each lane names the measurement that matches its
# kind of work. For every caller ceiling, take the best row on that measurement the ceiling
# can reach; among rows close to it, the cheapest wins. The chain lists those picks from the
# highest ceiling down, so whatever the caller's ceiling, the first candidate it can reach is
# the best-value one it can reach. "Close" is a near-tie in the quality-critical lanes
# (hardest-coding, hard-judgment, taste-final, long-context, coding-overflow) and a wider
# band in the throughput lanes, where a row also counts as close when it costs half as much
# for a gap twice that size. A cheaper row may not give up much on the lane's second
# measurement either. The tool that computes the picks is documented in
# docs/model-capabilities-2026-09.md. A candidate above the caller's ceiling, or one this
# host has not proven, is skipped. After the value picks, each chain ends with the other
# vendors' best rows, so a host with one subscription still gets a full chain. Cost is AA's
# cost to run its whole index at API prices — on subscription CLIs treat it as relative.
# max effort is in no chain: wherever it is ahead of the same model's xhigh row at all, it
# costs far more for it. Every max row stays selectable with --effort max.
# Your own job outcomes (~/.omnilane/jobs/) outrank these priors; edit lanes to match.

hardest-coding: codex gpt-6-astra xhigh | claude claude-opus-5-5 medium | codex gpt-6-astra medium | claude claude-fable-5-1 medium | claude claude-opus-5 high | codex gpt-6-astra low | claude claude-opus-5 medium | claude claude-opus-5-5 low | claude claude-opus-5 low | grok grok-4.7 high | grok grok-4.6 high | gemini gemini-3.8-flash-high - # value-first on the hard terminal-coding benchmark, the one coding measurement the frontier has not saturated, with scientific coding second and near-ties only: Astra xhigh ties Opus 5.5 xhigh there for less money at a lower score, so every caller that can reach it gets it, and Opus 5.5 high trails it by more than a near-tie; for callers below Astra xhigh, Opus 5.5 medium is level with Astra high for about half the money and ahead on scientific coding; Astra medium, Fable medium and Opus 5 high are the next rungs; Astra low and the Opus low rows carry the ladder down; Grok and Flash close the chain for hosts without Codex or Claude
bulk-mechanical: claude claude-opus-5-5 medium | codex gpt-6-astra medium | codex gpt-6-astra low | codex gpt-6-sol high | codex gpt-5.6-sol high | claude claude-opus-5-5 low | codex gpt-6-sol medium | claude claude-opus-5 low | gemini gemini-3.8-flash-high - # endurance work is value-first on the hard terminal benchmark with time per task second and the wide band: Opus 5.5 medium lands within the band of Astra xhigh for well under half the money and a shorter step, so it leads; Astra medium and low follow; GPT-6 Sol high is the cheap fast rung, with GPT-5.6 Sol high right behind it until a host proves GPT-6 Sol; Opus 5.5 low, Sol medium and Opus 5 low are the quick rows below; Flash closes the chain
triage: codex gpt-6-luna high | codex gpt-5.6-luna high | gemini gemini-3.8-flash-low - | claude claude-sonnet-5 low | claude claude-haiku-4-5 - # first-pass filtering is bought by the run, not by the answer: GPT-6 Luna high matches GPT-5.6 Luna high on the index for less than half the money, and the older row stays right behind it until a host proves GPT-6 Luna; Flash low is the cheap cross-vendor row; Sonnet low outscores Haiku for similar money and Haiku stays for hosts that have not proven Sonnet's effort rows
hard-judgment: claude claude-opus-5-5 xhigh | claude claude-fable-5-1 xhigh | claude claude-opus-5-5 medium | claude claude-fable-5-1 medium | claude claude-opus-5 high | claude claude-opus-5 medium | claude claude-opus-5-5 low | codex gpt-6-astra high | grok grok-4.7 high | gemini gemini-3.8-flash-high - # value-first on expert-level reasoning with graded analytical quality second and near-ties only: Opus 5.5 xhigh is the best row below max for less than half of Fable xhigh's money and leads analytical quality; Fable xhigh is ahead of Opus 5.5 high by more than a near-tie, so callers between the two get Fable xhigh; below them Opus 5.5 medium, then Fable medium and the Opus 5 ladder, with Opus 5.5 low as the cheap floor; Astra high is Codex's best-value row and the independent opinion for hosts without Claude (ask for it with --vendor codex), Grok 4.7 the third family; this lane is not a controller selector
taste-final: claude claude-opus-5-5 xhigh | claude claude-opus-5-5 high | claude claude-opus-5-5 medium | grok grok-4.7 high | grok grok-4.6 high | codex gpt-6-astra xhigh | gemini gemini-3.8-flash-high - # no benchmark measures taste, and none here covers Chinese phrasing; the nearest evidence is expert grading of finished documents, overall first and presentation second, near-ties only: Opus 5.5 xhigh, high and medium are graded above every other row each of them displaces, for less money than the Opus 5 and Fable rows they replace; Grok 4.7 high is graded level with Opus 5.5 medium and serves callers below it; Astra xhigh is Codex's best-graded row; final prose still needs human review
consult: codex gpt-6-astra xhigh | claude claude-opus-5-5 xhigh | grok grok-4.7 high | grok grok-4.6 high | gemini gemini-3.8-flash-high - # direct named-model consultation is not a value lane: each vendor's strongest generally reachable configuration below max, with the older Grok behind the newer for a lane dispatch on a host that has not proven 4.7; keep --vendor to pin the requested family. --vendor takes the vendor's first segment and never falls through, so on a host that has not proven grok-4.7 ask for --model grok-4.6
ui-draft: claude claude-opus-5-5 high | claude claude-opus-5-5 medium | codex gpt-6-astra medium | claude claude-opus-5-5 low | codex gpt-6-sol medium | codex gpt-6-astra low | gemini gemini-3.8-flash-high - # UI drafts need a design system or reference images; visual understanding is near-saturated at the top, so value decides within it, with hard coding second: Opus 5.5 high reads images within a near-tie of every row above it and codes close enough, for about half of xhigh's money; Opus 5.5 medium and Astra medium follow; Opus 5.5 low and GPT-6 Sol medium still read images well but code much worse; Astra low stays until a host proves GPT-6 Sol; Fable has no published visual result and is left out rather than assumed; none of this proves visual taste
long-context: claude claude-opus-5 high | claude claude-opus-5 medium | claude claude-opus-5 low | codex gpt-5.6-terra xhigh | gemini gemini-3.8-flash-high - # the established long-context benchmark is saturated and separates nobody; on the harder one Claude leads every other family by a wide margin at every effort, and Opus keeps that lead down to low effort, which makes it both the best and the cheap choice; Fable leads it only at max effort for several times the money; Opus 5.5 has no published result on it yet and is left out rather than assumed; Terra xhigh and Flash are the other vendors' best-value rows (Terra max scores higher for about twice the money and, like every max row, is explicit-only); context capacity alone proves nothing
fast-agentic: codex gpt-6-sol high | codex gpt-6-sol medium | codex gpt-6-sol low | codex gpt-6-astra low | gemini gemini-3.8-flash-medium - | claude claude-opus-5-5 low # tool loops need automation accuracy and a short time per step, value-first with the wide band, and a row that is slow to its first token is no fast row whatever it scores: GPT-6 Sol high is within the band of the best quick starters for a fraction of the money (its xhigh row scores a little higher but waits many times longer for the first token); Sol medium and low are faster and cheaper rungs; Astra low stays until a host proves GPT-6 Sol; Flash medium is the cross-vendor row; Opus 5.5 low is the quick Claude row; Haiku is gone because it scores close to nothing on automation
live-search: grok grok-4.7 high | grok grok-4.6 high | gemini gemini-3.8-flash-high - | claude claude-opus-5-5 low | off # Grok is the only native X/web source, newest proven release first, and both releases hallucinate less than any fallback that publishes a rate; Flash and Opus 5.5 low provide generic web search, not equivalent social context; Opus 5.5 low replaces medium because it is within a near-tie of medium on the knowledge benchmark for about half the money; Opus rather than Sonnet because Sonnet's effort rows assert more false facts than true ones on the knowledge benchmark
coding-overflow: grok grok-4.7 high | grok grok-4.6 high | gemini gemini-3.8-flash-high - | kimi kimi-k3 - | qwen qwen3-coder-plus - | opencode - - | off # explicit Codex-quota relief, so no Codex row: Grok 4.7 edges 4.6 on the hard terminal-coding benchmark and on scientific coding; keep all existing non-Codex fallbacks and do not infer unverified Qwen aliases from another harness
arbitrate: off - - # opinion panel remains opt-in because each voter and round consumes quota
                                                # Enable: `arbitrate: vote codex,claude,grok -` (any 1-4 of codex/claude/grok/gemini)
                                                # Debate round (each voter rebuts the others): set the effort field to 2.
                                                # Custom gate: `arbitrate: exec /path/to/script -`
# No automatic risk escalation or failure-triggered effort upgrade is added.
